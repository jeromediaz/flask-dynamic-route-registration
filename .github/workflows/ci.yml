name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        flask: ["", "floor"]
        exclude:
          # flask 2.0 imports werkzeug.url_quote, deleted in werkzeug 2.3.
          # The 2.0 line only runs on Python <= 3.10, where a werkzeug<2.3 pin
          # still has every security fix it ever got.
          - python-version: "3.11"
            flask: floor
          - python-version: "3.12"
            flask: floor
          - python-version: "3.13"
            flask: floor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Prove the declared flask floor is real, not just declared.
      - run: pip install "flask~=2.0.0" "werkzeug<2.3" "jinja2<3.1" "itsdangerous<2.1" "click<8.1" && python -c "import flask; print('flask', flask.__version__)"
        if: matrix.flask == 'floor'
      - run: pytest -q
      - run: black --check src/ tests/
      - run: ruff check src/ tests/
      - run: mypy src/flask_dynamic_route_registration

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Trusted Publishing: no API token. Requires a publisher on PyPI
  # for this repo, workflow "ci.yml" and environment "pypi".
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
