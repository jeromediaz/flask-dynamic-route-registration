name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        flask: ["~=2.0.0", ""]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Prove the declared flask floor is real, not just declared.
      - run: pip install "flask${{ matrix.flask }}" && python -c "import flask; print('flask', flask.__version__)"
        if: matrix.flask != ''
      - run: pytest -q
      - run: black --check src/ tests/
      - run: ruff check src/ tests/
      - run: mypy src/flask_dynamic_route_registration

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Trusted Publishing: no API token. Requires a publisher on PyPI
  # for this repo, workflow "ci.yml" and environment "pypi".
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
