[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"flask_dynamic_route_registration" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "flask-dynamic-route-registration"
version = "0.10.0"
authors = [
  { name="Jérôme DIAZ", email="jerome_diaz@me.com" },
]
description = "A library to help dynamically register routes in Flask applications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: Flask",
    "Typing :: Typed",
]
keywords = ["flask", "route", "dynamic"]
dependencies = [
    "flask>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = ["black==26.10.1", "pip-tools", "pytest>=8.0", "ruff==0.17.5", "mypy==2.4.1"]

[project.urls]
"Homepage" = "https://github.com/jeromediaz/flask-dynamic-route-registration"
"Bug Tracker" = "https://github.com/jeromediaz/flask-dynamic-route-registration/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = ["E", "F", "B", "C4", "I", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
