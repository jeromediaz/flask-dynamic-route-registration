# Mirrors the CI "test" job so a broken release never reaches GitHub.
# Uses the repo's .venv explicitly so hooks work without activating it.
# Needs the dev tools installed once: uv venv && uv pip install -e ".[dev]"
pre-commit:
  parallel: false
  commands:
    black:
      glob: "*.py"
      run: .venv/bin/python -m black --check {staged_files}
    ruff:
      glob: "*.py"
      run: .venv/bin/python -m ruff check {staged_files}
    mypy:
      # Whole package, not {staged_files}: a change here can break types elsewhere.
      glob: "*.py"
      run: .venv/bin/python -m mypy src/flask_dynamic_route_registration

pre-push:
  parallel: false
  commands:
    pytest:
      run: .venv/bin/python -m pytest -q
    black:
      run: .venv/bin/python -m black --check src/ tests/
    ruff:
      run: .venv/bin/python -m ruff check src/ tests/
    mypy:
      run: .venv/bin/python -m mypy src/flask_dynamic_route_registration
